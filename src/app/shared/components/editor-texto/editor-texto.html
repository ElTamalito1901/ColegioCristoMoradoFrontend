<div class="rounded-lg border border-[#E3D5C4] bg-white overflow-hidden focus-within:ring-2 focus-within:ring-[#4A1F52]/30">
  <div class="flex flex-wrap items-center gap-0.5 px-2 py-1.5 border-b border-[#E3D5C4] bg-[#FAF6EF]">
    @for (b of botones; track b.cmd) {
      <button type="button" [title]="b.titulo"
              (mousedown)="$event.preventDefault()" (click)="ejecutar(b.cmd)"
              class="min-w-7 h-7 px-1.5 rounded text-[13px] text-[#241521] hover:bg-[#EFEAF3] transition-colors"
              [innerHTML]="b.html"></button>
    }
  </div>
  <div #area contenteditable="true" role="textbox" aria-multiline="true"
       class="editor-area contenido-rico px-3 py-2.5 text-[13.5px] text-[#241521] outline-none overflow-y-auto"
       [style.min-height.px]="alto" [style.max-height.px]="alto * 2"
       [attr.data-placeholder]="placeholder"
       (input)="emitir()" (blur)="emitir()" (paste)="pegar($event)"></div>
</div>
