<div class="relative">
  <input [type]="visible() ? 'text' : 'password'"
         [id]="inputId || null" [attr.name]="nombre || null"
         [value]="valor()" (input)="escribir($any($event.target).value)" (blur)="onTouched()"
         [placeholder]="placeholder" [attr.autocomplete]="autocomplete" [disabled]="deshabilitado()"
         class="w-full pr-11 border outline-none transition-colors focus:ring-2"
         [ngClass]="claseInput + (invalido ? ' border-[#A62639] focus:ring-[#A62639]/25' : ' border-[#E3D5C4] focus:ring-[#4A1F52]/30')" />
  <button type="button" (click)="visible.set(!visible())" tabindex="-1"
          [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [title]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-md flex items-center justify-center text-[#6B5A67] hover:text-[#4A1F52] hover:bg-[#EFEAF3]">
    @if (visible()) {
      <svg viewBox="0 0 24 24" fill="none" class="w-[18px] h-[18px]" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.1 6.1C3.6 7.9 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 4.9-1.3"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" class="w-[18px] h-[18px]" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    }
  </button>
</div>
